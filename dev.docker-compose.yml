version: '3.8'

services:
  db:
    image: mysql:8.4
    container_name: mysql_helpets
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: helpets_db # Reemplaza por el nombre real de tu BD
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: dev.Dockerfile
    container_name: app-helpets
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "8088:8080"
    depends_on:
      - db

volumes:
  mysql_data: