version: '3.8'

services:
  db:
    image: mysql:8.4
    container_name: mysql_helpets
    restart: no
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE} 
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: dev.Dockerfile
    container_name: app-helpets
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      - db
  
    
  dependency-check:
    image: maven:3.9-eclipse-temurin-17
    container_name: maven-check
    working_dir: /app
    volumes:
      - .:/app
      - ~/.m2:/root/.m2  # Cache de Maven
    environment:
      - NVD_API_KEY=${NVD_API_KEY}
    command: mvn org.owasp:dependency-check-maven:check
    depends_on:
      - web
    profiles:
      - security  # Solo ejecuta si lo especificas
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_helpets
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - web

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_helpets
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

volumes:
  mysql_data: