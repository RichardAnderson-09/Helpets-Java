version: '3.8'

services:
  db:
    image: mysql:8.4
    container_name: mysql_helpets_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data_prod:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-helpets-prod
    restart: always
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      - db

volumes:
  mysql_data_prod: