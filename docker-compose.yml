version: '3.8'

services:
  db:
    image: mysql:8.4
    container_name: mysql_helpets_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: helpets_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_prod:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: Dockerfile # Apunta al archivo de producción
    container_name: app-helpets-prod
    restart: always
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      #- "80:8080" # Puerto 80 hacia internet
      - "127.0.0.1:8080:8080"
    depends_on:
      - db

volumes:
  mysql_data_prod: